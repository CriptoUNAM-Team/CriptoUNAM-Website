<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/5.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CriptoUNAM</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('goya-theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-goya-theme', t)
          }
        } catch (e) {}
      })()
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Inter: tipografía del rediseño.
         Chakra Petch: display con esquinas achaflanadas, la del cartel de Goya
         Hack. JetBrains Mono: las etiquetas técnicas y el snippet de código del
         mismo cartel. Las tres con `display=swap` para no bloquear el primer
         render con la descarga. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    >
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body, #root {
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      /* Prevenir zoom en inputs en iOS */
      input, select, textarea {
        font-size: 16px !important;
      }

      /* Mejorar el soporte para safe area en móviles */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Asegurar que el modal de AppKit tenga prioridad máxima */
      w3m-modal {
        position: fixed !important;
        z-index: 2147483647 !important;
        inset: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #D4AF37;
        font-family: Arial, sans-serif;
        z-index: 9999;
      ">
        <h1 style="font-size: 2rem; margin-bottom: 1rem;">CriptoUNAM</h1>
        <p style="font-size: 1.2rem;">Cargando aplicación...</p>
        <div style="
          width: 40px;
          height: 40px;
          border: 4px solid #D4AF37;
          border-top: 4px solid transparent;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin: 20px auto;
        "></div>
      </div>
    </div>
    
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    
    <script src="/clear-sw.js"></script>
    <!-- Pantalla de rescate si React no monta. En archivo aparte, no en línea:
         un `<script>` embebido obligaría a abrir `script-src 'unsafe-inline'`
         en la CSP y con eso la protección contra XSS deja de servir. -->
    <script src="/boot-check.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
