name: Foundry

on:
  push:
    paths:
      - 'criptounam-contracts/**'
      - '.github/workflows/foundry.yml'
  pull_request:
    paths:
      - 'criptounam-contracts/**'
      - '.github/workflows/foundry.yml'
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: criptounam-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge version
        run: forge --version

      - name: Forge fmt
        run: forge fmt --check

      - name: Forge build
        run: forge build --sizes

      - name: Forge tests
        run: forge test -vvv
